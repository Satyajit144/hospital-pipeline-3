name: Databricks CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - validation
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      # 1. Dev Branch Deployment
      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        run: |
          databricks bundle deploy --target dev --host "${{ secrets.DATABRICKS_HOST }}" --token "${{ secrets.DATABRICKS_TOKEN }}"

      # 2. Validation Branch Deployment
      - name: Deploy to Validation
        if: github.ref == 'refs/heads/validation'
        run: |
          databricks bundle deploy --target validation --host "${{ secrets.DATABRICKS_HOST }}" --token "${{ secrets.DATABRICKS_TOKEN }}"

      # 3. Main (Production) Branch Deployment
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: |
          databricks bundle deploy --target prod --host "${{ secrets.DATABRICKS_HOST }}" --token "${{ secrets.DATABRICKS_TOKEN }}"
