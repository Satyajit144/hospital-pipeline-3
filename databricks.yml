bundle:
  name: hospital_pipeline_3

include:
  - resources/*.yml

# 1. Global Variables define karein
variables:
  target_catalog:
    description: "The Unity Catalog to use for this environment"
    default: "dev"

# 2. Targets (Environments)
targets:
  # --- DEV ENVIRONMENT ---
  dev:
    default: true
    workspace:
      host: https://dbc-6e436782-452f.cloud.databricks.com
    variables:
      target_catalog: "dev_catalog"

  # --- VALIDATION ENVIRONMENT ---
  validation:
    workspace:
      host: https://dbc-6e436782-452f.cloud.databricks.com
    variables:
      target_catalog: "val_catalog"

  # --- PRODUCTION ENVIRONMENT ---
  prod:
    workspace:
      host: https://dbc-6e436782-452f.cloud.databricks.com
    variables:
      target_catalog: "prod_catalog"
